<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Homework Writer — offline typing simulator</title>
<link rel="stylesheet" href="../assets/styles.css" />
<style>
  #paper {
    white-space: pre-wrap; min-height: 220px; padding: 16px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
  }
  #paper::after { content: '|'; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pass { color: #1e8e3e; font-weight: 600; }
  .fail { color: var(--danger); font-weight: 600; }
</style>
</head>
<body>
<header class="topbar"><div class="brand">✍️ Offline typing simulator</div></header>
<main>
  <section class="card">
    <p>No Google account involved. The Docs API is replaced with an in-page mock document, so
       this exercises the real <code>typist.js</code> — pacing, bursts, typos and the
       <code>deleteContentRange</code> index maths — and then checks the result matches the
       source exactly.</p>
    <textarea id="src" rows="6">The mitochondria is the powerhouse of the cell. It converts nutrients into adenosine triphosphate, which powers almost everything a cell does.

A second paragraph follows, so that paragraph pauses and speed drift are exercised too. Typos are forced on here, which is why corrections keep appearing.</textarea>
    <div class="actions" style="margin-top:12px">
      <button id="run" class="btn btn-primary">Run simulation</button>
      <button id="fast" class="btn">Run 200× speed self-test</button>
      <button id="docx" class="btn">Test the .docx reader</button>
    </div>
  </section>
  <section class="card">
    <h2>Document</h2>
    <div id="paper"></div>
    <p id="verdict" class="estimate">—</p>
  </section>
  <pre id="log" class="log"></pre>
</main>

<script type="module">
import { HumanTypist, estimateMs, formatDuration, splitWords } from '../src/typist.js';
import { setRateLimit } from '../src/gdocs.js';
import { setClientId } from '../src/auth.js';

const paper = document.getElementById('paper');
const verdict = document.getElementById('verdict');
const logEl = document.getElementById('log');
const log = (m, cls = '') => {
  const s = document.createElement('span');
  s.className = cls;
  s.textContent = m + '\n';
  logEl.append(s);
  logEl.scrollTop = logEl.scrollHeight;
};

/* A stand-in for the Google Docs API. `doc` is the body text; a real Doc always
   ends with an undeletable newline, so index 1 is the first character and the
   body end index is doc.length + 2 — the same maths typist.js relies on. */
let doc = '';
let calls = 0;
const realFetch = window.fetch.bind(window);

window.fetch = async (url, init = {}) => {
  calls++;
  const body = init.body ? JSON.parse(init.body) : null;
  if (String(url).includes(':batchUpdate')) {
    for (const req of body.requests) {
      if (req.insertText) {
        doc += req.insertText.text;
      } else if (req.deleteContentRange) {
        const { startIndex, endIndex } = req.deleteContentRange.range;
        if (startIndex < 1 || endIndex > doc.length + 1 || startIndex >= endIndex) {
          throw new Error(`bad range ${startIndex}..${endIndex} for a body of ${doc.length}`);
        }
        doc = doc.slice(0, startIndex - 1) + doc.slice(endIndex - 1);
      }
    }
    paper.textContent = doc;
    return new Response('{}', { status: 200 });
  }
  // documents.get?fields=body(content(endIndex))
  return new Response(JSON.stringify({ body: { content: [{ endIndex: doc.length + 2 }] } }), { status: 200 });
};

// auth.js asks Google Identity Services for a token; hand it a fake one.
setClientId('simulator.apps.googleusercontent.com', { persist: false });
window.google = {
  accounts: {
    oauth2: {
      initTokenClient: () => ({
        requestAccessToken() { this.callback({ access_token: 'mock', expires_in: 3600 }); },
      }),
      revoke: () => {},
    },
  },
};

async function simulate({ wpm, typoRate, pauseLevel, label }) {
  doc = '';
  calls = 0;
  paper.textContent = '';
  verdict.textContent = 'Running…';

  const text = document.getElementById('src').value.trim();
  log(`${label}: ${text.length} chars, estimate ${formatDuration(estimateMs(text, { wpm, typoRate, pauseLevel }))}`);

  const typist = new HumanTypist({ documentId: 'mock', wpm, typoRate, pauseLevel });
  const started = performance.now();
  let result;
  try {
    result = await typist.type(text);
  } catch (err) {
    verdict.textContent = `ERROR — ${err.message}`;
    verdict.className = 'estimate fail';
    log(`${label}: ERROR — ${err.message}`, 'fail');
    return false;
  }
  const took = performance.now() - started;

  const ok = doc === text;
  verdict.textContent = ok
    ? `Document matches the source exactly (${doc.length} chars, ${result.requests} edits, ${(took / 1000).toFixed(1)}s).`
    : `MISMATCH — document is ${doc.length} chars, source is ${text.length}.`;
  verdict.className = ok ? 'estimate pass' : 'estimate fail';
  log(`${label}: ${ok ? 'PASS' : 'FAIL'} — ${result.requests} edits, ${calls} API calls, ${(took / 1000).toFixed(1)}s`, ok ? 'pass' : 'fail');
  if (!ok) log(`  got: ${JSON.stringify(doc.slice(0, 200))}\n  want: ${JSON.stringify(text.slice(0, 200))}`, 'fail');
  return ok;
}

document.getElementById('docx').addEventListener('click', async () => {
  const { extractText } = await import('../src/extract.js');
  const expected = [
    'Essay title',
    'First run and second run.',
    '\tIndented line',
    'after a break.',
    '',
    'Final paragraph with an & ampersand.',
  ].join('\n');
  try {
    const blob = await (await realFetch('./fixture.docx')).blob();
    const text = await extractText(new File([blob], 'fixture.docx'));
    const ok = text === expected;
    log(`.docx reader: ${ok ? 'PASS' : 'FAIL'} — ${JSON.stringify(text)}`, ok ? 'pass' : 'fail');
  } catch (err) {
    log(`.docx reader: ERROR — ${err.message}`, 'fail');
  }
});

document.getElementById('run').addEventListener('click', () =>
  simulate({ wpm: 70, typoRate: 0.12, pauseLevel: 1, label: 'live' }));

// Same engine, absurd speed and no pauses: a fast correctness check over several
// configurations, including a punishing 100%-typo run.
document.getElementById('fast').addEventListener('click', async () => {
  setRateLimit(1e6); // the quota pacing is not what this test is checking
  log(`splitWords round-trip: ${splitWords(document.getElementById('src').value).join('') === document.getElementById('src').value ? 'PASS' : 'FAIL'}`);
  let allOk = true;
  for (const cfg of [
    { wpm: 12000, typoRate: 0, pauseLevel: 0, label: 'no typos' },
    { wpm: 12000, typoRate: 0.3, pauseLevel: 0, label: 'typos 30%' },
    { wpm: 12000, typoRate: 1, pauseLevel: 0, label: 'typos 100%' },
    { wpm: 12000, typoRate: 1, pauseLevel: 1, label: 'typos 100% + pauses' },
  ]) {
    allOk = (await simulate(cfg)) && allOk;
  }
  log(allOk ? 'ALL CONFIGURATIONS PASS' : 'SOME CONFIGURATIONS FAILED', allOk ? 'pass' : 'fail');
});
</script>
</body>
</html>
